<!DOCTYPE html>
<html dir="rtl" lang="ar" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فَهم | منصة إدارة الشكاوى الذكية</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./css/custom.css">

  <!-- Tailwind Custom Config from Stitch DESIGN.md -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0052cc",
            "primary-dark": "#003d9b",
            "primary-container": "#0052cc",
            "on-primary": "#ffffff",
            "surface": "#f8f9ff",
            "surface-card": "#ffffff",
            "surface-container": "#e5eeff",
            "surface-container-low": "#eff4ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-high": "#dce9ff",
            "surface-container-highest": "#d3e4fe",
            "tertiary": "#510ebb",
            "tertiary-container": "#6a36d3",
            "secondary": "#006a63",
            "secondary-container": "#79f7ea",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#434654",
            "outline": "#737685",
            "outline-variant": "#c3c6d6",
            "error": "#ba1a1a",
            "error-container": "#ffdad6"
          },
          fontFamily: {
            sans: ['Tajawal', 'Cairo', 'Be Vietnam Pro', 'sans-serif'],
            body: ['Tajawal', 'Cairo', 'sans-serif'],
            headline: ['Tajawal', 'Cairo', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>

<body class="bg-[#f8f9ff] text-[#0b1c30] min-h-screen flex flex-col md:flex-row antialiased select-none font-body">

  <!-- Sidebar Container -->
  <div id="sidebar-container"></div>

  <!-- Mobile Top Bar -->
  <div class="md:hidden flex items-center justify-between p-4 bg-white border-b border-[#e2e8f0] sticky top-0 z-20">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-[#0052cc] text-white flex items-center justify-center font-bold text-sm">
        فَ
      </div>
      <span class="font-bold text-lg text-[#003d9b]">فَهم</span>
    </div>
    <div class="flex items-center gap-2">
      <a href="#dashboard" class="p-2 text-[#434654] hover:text-[#0052cc]"><span class="material-symbols-outlined text-[20px]">dashboard</span></a>
      <a href="#inbox" class="p-2 text-[#434654] hover:text-[#0052cc]"><span class="material-symbols-outlined text-[20px]">inbox</span></a>
      <a href="#knowledge-base" class="p-2 text-[#434654] hover:text-[#0052cc]"><span class="material-symbols-outlined text-[20px]">menu_book</span></a>
      <a href="#analytics" class="p-2 text-[#434654] hover:text-[#0052cc]"><span class="material-symbols-outlined text-[20px]">analytics</span></a>
    </div>
  </div>

  <!-- Main Content Wrapper -->
  <main class="flex-1 md:mr-64 p-4 md:p-8 lg:p-10 max-w-7xl w-full mx-auto min-h-screen overflow-y-auto">
    <div id="main-content">
      <!-- Dynamic Content Rendered by FahmApp -->
    </div>
  </main>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Toast Notification Container (Bottom Left for RTL) -->
  <div id="toast-container" class="fixed bottom-6 left-6 z-50 flex flex-col gap-2 max-w-md w-full pointer-events-none"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <!-- Firebase Configuration & Service -->
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-service.js"></script>

  <!-- App Components & Pages -->
  <script src="./js/components/sidebar.js"></script>
  <script src="./js/components/header.js"></script>
  <script src="./js/components/modals.js"></script>
  <script src="./js/pages/dashboard.js"></script>
  <script src="./js/pages/inbox.js"></script>
  <script src="./js/pages/details.js"></script>
  <script src="./js/pages/knowledge.js"></script>
  <script src="./js/pages/analytics.js"></script>
  <script src="./js/app.js"></script>
